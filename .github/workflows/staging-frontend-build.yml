name: Staging frontend build

on:
  push:
    branches: [staging-main]
  pull_request:
    branches: [staging-main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://chopchowserver2.onrender.com/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --force
      - name: Build Next.js staging app
        run: npm run build
